<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título e descrição — bilíngues mas PT primeiro -->
    <title>AllCascais — Serviços verificados em Cascais</title>
    <meta
      name="description"
      content="Encontra profissionais, ofertas e imóveis em Cascais. Recomendado por residentes, contacto direto, sem intermediários. Em PT e EN."
    />

    <!-- Cores e aparência -->
    <meta name="theme-color" content="#1F1F3D" />
    <meta name="color-scheme" content="light" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="AllCascais" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO base -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://allcascais.com/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AllCascais" />
    <meta
      property="og:title"
      content="AllCascais — Serviços verificados em Cascais"
    />
    <meta
      property="og:description"
      content="Profissionais, ofertas e imóveis em Cascais. Recomendado por residentes, contacto direto, sem intermediários."
    />
    <meta property="og:url" content="https://allcascais.com/" />
    <meta property="og:image" content="https://allcascais.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_GB" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AllCascais — Serviços verificados em Cascais"
    />
    <meta
      name="twitter:description"
      content="Profissionais, ofertas e imóveis em Cascais. Recomendado por residentes, contacto direto."
    />
    <meta name="twitter:image" content="https://allcascais.com/og-image.jpg" />

    <!--
      hreflang: removido o /en porque não existe rota separada.
      O idioma é gerido por contexto React, não por URL.
      Quando implementares /en como rota real, adiciona de volta:
        <link rel="alternate" hreflang="en" href="https://allcascais.com/en" />
    -->
    <link rel="alternate" hreflang="pt" href="https://allcascais.com/" />
    <link rel="alternate" hreflang="x-default" href="https://allcascais.com/" />

    <!-- Schema.org — LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "AllCascais",
        "url": "https://allcascais.com",
        "logo": "https://allcascais.com/favicon-96x96.png",
        "image": "https://allcascais.com/og-image.jpg",
        "description": "Diretório de serviços, ofertas e imóveis em Cascais. Profissionais recomendados por residentes.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Avenida Costa Pinto, n.º 60, Sala B, 1.º andar esquerdo",
          "addressLocality": "Cascais",
          "addressRegion": "Lisboa",
          "postalCode": "2750-374",
          "addressCountry": "PT"
        },
        "email": "info@allcascais.com",
        "areaServed": {
          "@type": "City",
          "name": "Cascais"
        },
        "knowsLanguage": ["pt", "en"]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
